version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./threat_intel.db
      - CHROMA_PERSIST_DIR=./chroma_data
      - ALIENVAULT_OTX_KEY=${ALIENVAULT_OTX_KEY}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - THREATBOOK_API_KEY=${THREATBOOK_API_KEY}
      - QIANXIN_API_KEY=${QIANXIN_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - backend_data:/app/data
      - backend_chroma:/app/chroma_data
      - backend_graph:/app/graph_data
      - backend_model:/app/model_data
      - backup_data:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_chroma:
  backend_graph:
  backend_model:
  backup_data:
